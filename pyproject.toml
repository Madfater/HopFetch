[project]
name = "hop-fetch"
version = "0.2.0"
description = "Web app for multi-connection downloads from file hosting platforms"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography",
    "ddddocr",
    "fastapi",
    "pillow",
    "requests[socks]",
    "requests-futures",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
