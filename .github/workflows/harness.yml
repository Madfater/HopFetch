name: harness

on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Conventions
        run: python3 script/check_conventions.py --base "origin/${{ github.base_ref }}"
      - uses: astral-sh/setup-uv@v6
      - name: Project checks
        run: python3 script/check.py
